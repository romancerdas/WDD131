<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modals</title>
  <link rel="stylesheet" href="modal.css">
  <script src="modal.js" defer></script>
</head>
<body>

  <h1>Gallery</h1>

  <div class="gallery">

    <img src="images/photo1.jpg" alt="Gallery Image 1" class="gallery-img">

    <img src="images/photo2.jpg" alt="Gallery Image 2" class="gallery-img">

    <img src="images/photo3.jpg" alt="Gallery Image 3" class="gallery-img">

    <img src="images/photo4.jpg" alt="Gallery Image 4" class="gallery-img">

    <img src="images/photo5.jpg" alt="Gallery Image 5" class="gallery-img">

    <img src="images/photo6.jpg" alt="Gallery Image 6" class="gallery-img">

  </div>

  <dialog id="modal">
    <button id="closeModal">X</button>
    <img id="modalImage" src="" alt="Expanded Image">
  </dialog>

</body>
</html>
