<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Book</title>
  <meta name="description" content="Searchable recipe book for WDD 131 Week 10." />
  <link rel="stylesheet" href="styles.css" />
  <script src="main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="brand" aria-label="Recipe Book">
      <h1>RecipeBook</h1>
    </div>
  </header>

  <main class="page">
    <form class="search" role="search" aria-label="Search recipes">
      <label class="sr-only" for="search-input">Find a recipe</label>
      <input id="search-input" name="q" type="search" placeholder="Find a recipe" autocomplete="off" />
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="27" cy="27" r="18" fill="none" stroke="currentColor" stroke-width="5" />
          <line x1="41" y1="41" x2="57" y2="57" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
        </svg>
      </button>
    </form>

    <section id="recipes" class="results" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <a href="https://www.flaticon.com/free-icons/recipe" target="_blank" rel="noreferrer">Recipe icons created by Freepik - Flaticon</a>
    <nav class="social" aria-label="Social links">
      <a href="#" aria-label="Instagram">◎</a>
      <a href="#" aria-label="YouTube">▶</a>
      <a href="#" aria-label="Pinterest">P</a>
    </nav>
  </footer>
</body>
</html>
